name: Debug Pan Julho

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Buscar Pan Julho
        run: |
          python3 - <<'EOF'
          import csv, io, requests

          TOKEN = "ZU1DsPDbRbva9ccEDF8eRjv7BrkkSwqj96lfrt1z"
          AUTH  = "vyOhX5a2LbXG9B2LHDK0I5JUQe51m63rkRlP7crsQHAKIbi4Sugl4z2hSozDl4iakm79HMtIlwRIw3RdZ0ZZ4ZdXTQ0iJnE3qc1HMRbLLZDHKS43TdcrPbwYeqn932PLKCdKOJTw3PJQE8NmUjGSpuT74FxQsJ59R6IaprxVLxX6YG8OmOJOD5dpEY0Y9TqsvwLGZvAnN7Fl2sjQ5v2AnAiAjn0FEdlE3hVp69oENti8hStYmkCstXIuvtz0PpNM"
          BASE  = "https://api.autoconf.com.br/api/v1"

          def pn(s):
              if not s: return 0.0
              try: return float(str(s).strip().replace('.','').replace(',','.'))
              except: return 0.0

          r = requests.get(f"{BASE}/relatorio/financeiro/lucro-venda",
              params={'mes': 7, 'ano': 2026},
              headers={'token': TOKEN, 'Authorization': AUTH}, timeout=60)
          print("status:", r.status_code)

          rows = list(csv.DictReader(io.StringIO(r.text)))
          pan_rows = [row for row in rows if 'PAN' in (row.get('Banco') or '').upper()]

          print(f"\n=== Banco PAN — Julho/2026 ({len(pan_rows)} veículos) ===")
          total_fin = 0
          total_ret = 0
          for row in pan_rows:
              saida  = (row.get('Saida') or '').strip()
              placa  = (row.get('Placa') or '').strip()
              fin    = pn(row.get('Valor Financiado'))
              ret    = pn(row.get('Retorno'))
              rev    = (row.get('Revenda Saída ID') or '').strip()
              loja   = 'MM' if rev == '185' else ('BK' if rev == '726' else rev)
              banco  = (row.get('Banco') or '').strip()
              total_fin += fin
              total_ret += ret
              print(f"  [{loja}] {placa:<10} | {saida:<30} | fin=R${fin:>10,.2f} | ret=R${ret:>8,.2f} | banco={banco}")

          print(f"\n  TOTAL: fin=R${total_fin:,.2f} | ret=R${total_ret:,.2f} | qtd={len(pan_rows)}")
          EOF
