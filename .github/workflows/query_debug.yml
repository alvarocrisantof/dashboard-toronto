name: Query Debug

on:
  workflow_dispatch:
    inputs:
      banco:
        description: 'Banco (ex: SANTANDER)'
        required: true
      mes:
        description: 'Mês (ex: 6)'
        required: true
      ano:
        description: 'Ano (ex: 2026)'
        required: true

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Buscar dados
        run: |
          python3 - <<'EOF'
          import csv, io, requests, os

          TOKEN = "ZU1DsPDbRbva9ccEDF8eRjv7BrkkSwqj96lfrt1z"
          AUTH  = "vyOhX5a2LbXG9B2LHDK0I5JUQe51m63rkRlP7crsQHAKIbi4Sugl4z2hSozDl4iakm79HMtIlwRIw3RdZ0ZZ4ZdXTQ0iJnE3qc1HMRbLLZDHKS43TdcrPbwYeqn932PLKCdKOJTw3PJQE8NmUjGSpuT74FxQsJ59R6IaprxVLxX6YG8OmOJOD5dpEY0Y9TqsvwLGZvAnN7Fl2sjQ5v2AnAiAjn0FEdlE3hVp69oENti8hStYmkCstXIuvtz0PpNM"
          BASE  = "https://api.autoconf.com.br/api/v1"

          BANCO = os.environ['BANCO']
          MES   = os.environ['MES']
          ANO   = os.environ['ANO']

          def pn(s):
              if not s: return 0.0
              try: return float(str(s).strip().replace('.','').replace(',','.'))
              except: return 0.0

          r = requests.get(f"{BASE}/relatorio/financeiro/lucro-venda",
              params={'mes': MES.zfill(2), 'ano': ANO, 'token': TOKEN},
              headers={'authorization': AUTH}, timeout=60)
          print("status:", r.status_code)
          if r.status_code != 200:
              print(r.text[:200]); exit(1)

          rows = list(csv.DictReader(io.StringIO(r.text)))
          filtrado = [row for row in rows if BANCO.upper() in (row.get('Banco') or '').upper()]
          print(f"\n=== {BANCO} — {MES}/{ANO} ({len(filtrado)} veiculos) ===")
          total_fin = total_ret = 0
          for row in filtrado:
              placa = (row.get('Placa') or '').strip()
              saida = (row.get('Saida') or '').strip()
              fin   = pn(row.get('Valor Financiado'))
              ret   = pn(row.get('Retorno'))
              rev   = (row.get('Revenda Saida ID') or row.get('Revenda Saída ID') or '').strip()
              loja  = 'MM' if rev == '185' else ('BK' if rev == '726' else rev)
              total_fin += fin; total_ret += ret
              print(f"  [{loja}] {placa:<10} | {saida:<40} | fin=R${fin:>10,.2f} | ret=R${ret:>8,.2f}")
          print(f"\n  TOTAL: fin=R${total_fin:,.2f} | ret=R${total_ret:,.2f} | qtd={len(filtrado)}")
          EOF
        env:
          BANCO: ${{ github.event.inputs.banco }}
          MES: ${{ github.event.inputs.mes }}
          ANO: ${{ github.event.inputs.ano }}
