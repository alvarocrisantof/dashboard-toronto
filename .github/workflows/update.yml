name: Atualizar Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT — após liquidações noturnas
    - cron: '0 21 * * *'  # 18:00 BRT — fechamento do dia

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Atualizar FINAL via API AutoConf
        run: python update_dashboard.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Sem alteracoes" || \
            git commit -m "chore(data): atualiza FINAL via API AutoConf $(date +'%d/%m/%Y %H:%M')"
          git push
